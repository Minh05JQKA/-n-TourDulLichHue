<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">HueTour — Chạm vào miền di sản</title>
  <desc id="desc">Biểu tượng phẳng màu tím và vàng kết hợp cổng Ngọ Môn, tháp Thiên Mụ và dải lụa sông Hương.</desc>
  <g transform="translate(4 6)">
    <rect width="88" height="88" rx="21" fill="#1A0F2E"/>
    <rect x="1.5" y="1.5" width="85" height="85" rx="19.5" stroke="#D4AF37" stroke-opacity=".72"/>
    <!-- Tháp Thiên Mụ: seven compact tiers and a slender finial. -->
    <path d="M72 24V17m-4 8h8l-1.5 3h-5L68 25Zm-2 6h12l-2 3h-8l-2-3Zm-2 6h16l-2 3H66l-2-3Zm-2 6h20l-2 3H64l-2-3Zm-2 6h24l-2 3H62l-2-3Zm-2 6h28l-2 3H60l-2-3Zm-3 7h34l-3 4H56l-3-4Z" fill="#D4AF37"/>
    <!-- Ngọ Môn gate and its layered roof. -->
    <path d="M11 43c7-1 13-4 22-10 9 6 15 9 22 10-10 0-17-1-22-1s-12 1-22 1Z" fill="#D4AF37"/>
    <path d="M15 45h36v4H15zm3 5h30v5H18zm-4 6h38v5H14z" fill="#D4AF37"/>
    <path d="M18 61v9h30v-9M27 70V60q0-6 6-6t6 6v10" stroke="#D4AF37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sông Hương as a soft silk ribbon. -->
    <path d="M10 76c10-5 18 3 29-1s18-3 27 1 13 2 18-1" stroke="#F0D78E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 81c9-3 15 2 23 0s14-2 20 1 12 1 18-1" stroke="#D4AF37" stroke-opacity=".62" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g transform="translate(110 15)">
    <text x="0" y="39" fill="#F4E5B2" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing=".6">HueTour</text>
    <path d="M1 51h204" stroke="#D4AF37" stroke-opacity=".72"/>
    <circle cx="211" cy="51" r="2" fill="#D4AF37"/>
    <text x="1" y="70" fill="#E0D8ED" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="1.15">Chạm vào miền di sản</text>
  </g>
</svg>
